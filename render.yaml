services:
  # Backend API Web Service (Laravel 12 Docker)
  - type: web
    name: clinexa-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: Clinexa
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://clinexa-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: FRONTEND_URL
        value: https://clinexa-frontend.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: clinexa-frontend.onrender.com,localhost,localhost:5173,127.0.0.1,127.0.0.1:5173
      # ── SECRETS: set these in the Render dashboard → Environment ──
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # Frontend Web App (React + Vite SPA)
  - type: web
    name: clinexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://clinexa-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
